# Packaging (spec, "Packaging and updates"). Built unsigned unless the release workflow is given the signing
# secrets the product owner sets: see .github/workflows/release.yml.
appId: com.open-meridian.desktop
productName: Meridian Desktop
copyright: Copyright 2026 Societal Lab Inc.
directories:
  output: dist
files:
  - src/**
  - package.json
  - "!**/*.map"
extraResources:
  - from: build/notices
    to: notices
  - from: LICENSE
    to: LICENSE.meridian-desktop
  - from: build/update-key
    to: .
    filter: ["update-key.pem"]
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
publish:
  provider: github
  owner: open-meridian
  repo: meridian-desktop
  releaseType: draft
mac:
  category: public.app-category.finance
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Finance
