# meridian-desktop's checks, job by job:
# - checks: code structure (S2, S4, S5), licences and notices (S10), unit tests, the Electron support gate;
# - browser: the browser check of the pages the desktop draws, at 375, 582 and 1280 wide;
# - desktop-stand-in: the Playwright-driven run of the desktop against stand-in deployments (fast);
# - desktop-deployment: the same run against a real deployment, from the released CLI and chart on k3d;
# - package: unsigned builds for Linux (AppImage), Windows and macOS (both architectures), with the fuses
#   and the shipped notices checked in what was built.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.11.1"
  # The released CLI and the chart its documentation describes (as open-meridian/opencode#1 pins them).
  MERIDIAN_CLI_VERSION: v0.1.61
  MERIDIAN_CLI_SHA256: 1e51085c2dd8e5a418ecc936a5ace7bbd10db2e06d7c72176c0edde4b24abdfa
  CHART_VERSION: 0.1.632
  K3S_IMAGE: rancher/k3s:v1.36.5-k3s1
  K3D_VERSION: v5.9.0
  K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0
  HELM_VERSION: v3.19.0
  HELM_SHA256: a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: npm ci
      - name: Code structure (S2 file size, S5 pins)
        run: node scripts/check-structure.mjs
      - name: Interims name their end (S4)
        run: npm run check:interims
      - name: Licences by layer (S10)
        run: node scripts/check-licences.mjs
      - name: Unit tests
        run: npm test
      - name: Electron is a major Electron still supports
        run: node scripts/check-electron-support.mjs

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: The browser check at 375, 582 and 1280 wide
        run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: browser-check, path: test-results/browser-shots, if-no-files-found: ignore }

  desktop-stand-in:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: npm ci && node node_modules/electron/install.js
      - name: A display, and Chromium's sandbox allowed on this runner
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb
          # Ubuntu 24.04 stops unprivileged user namespaces, which Chromium's sandbox needs; the desktop
          # never runs without its sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: The desktop against stand-in deployments
        run: xvfb-run -a npm run test:desktop -- desktop.spec.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with: { name: desktop-stand-in, path: test-results, if-no-files-found: ignore }

  desktop-deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: npm ci && node node_modules/electron/install.js
      - name: A display, a headless browser, and Chromium's sandbox allowed on this runner
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npx playwright install --with-deps chromium
          python -m pip install argon2-cffi==25.1.0
      - name: The released CLI, k3d and Helm, each checked against its pinned checksum
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          curl -fsSL -o /tmp/meridian \
            "https://github.com/open-meridian/meridian-cli/releases/download/${MERIDIAN_CLI_VERSION}/meridian-x86_64-unknown-linux-musl"
          echo "${MERIDIAN_CLI_SHA256}  /tmp/meridian" | sha256sum -c -
          install -m 0755 /tmp/meridian "$HOME/.local/bin/meridian"
          curl -fsSL -o /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  /tmp/k3d" | sha256sum -c -
          install -m 0755 /tmp/k3d "$HOME/.local/bin/k3d"
          curl -fsSL -o /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          install -m 0755 /tmp/linux-amd64/helm "$HOME/.local/bin/helm"
          "$HOME/.local/bin/meridian" --version
      - name: A run directory only this job reads
        run: |
          run_dir="$RUNNER_TEMP/desktop"
          mkdir -p "$run_dir/config" && chmod 700 "$run_dir"
          { echo "RUN_DIR=$run_dir"; echo "KUBECONFIG=$run_dir/kubeconfig"; echo "XDG_CONFIG_HOME=$run_dir/config"; } >>"$GITHUB_ENV"
      - name: A deployment, from the released chart
        run: ci/deployment.sh
      - name: First run, and one person
        run: python ci/first_run.py "$RUN_DIR"
      - name: Two plugin instances, made, uploaded and launched by the released CLI
        run: ci/plugins.sh
      - name: The desktop against the deployment
        run: |
          DESKTOP_DEPLOYMENT=http://meridian.localhost DESKTOP_PERSON_FILE="$RUN_DIR/person.json" \
          DESKTOP_INSTANCES="$(cat "$RUN_DIR/instances")" xvfb-run -a npm run test:desktop -- desktop.spec.mjs
      - name: What the deployment said, when a step failed
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/kept"
          kubectl get pods -A -o wide >"$RUNNER_TEMP/kept/pods.txt" 2>&1 || true
          kubectl -n meridian get events --sort-by=.lastTimestamp >"$RUNNER_TEMP/kept/events.txt" 2>&1 || true
          for c in dashboard launcher; do
            kubectl -n meridian logs "deploy/meridian-meridian-runtime-$c" --tail=400 >"$RUNNER_TEMP/kept/$c.log" 2>&1 || true
          done
          # Never person.json, the kubeconfig or the CLI's sessions.
          cp "$RUN_DIR/meridian-up.log" "$RUNNER_TEMP/kept/" 2>/dev/null || true
          cp -R test-results "$RUNNER_TEMP/kept/" 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with: { name: desktop-deployment, path: "${{ runner.temp }}/kept", if-no-files-found: ignore }

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, flags: --linux, binary: "dist/linux-unpacked/meridian-desktop", resources: dist/linux-unpacked/resources }
          - { os: windows-2025, flags: --win, binary: "dist/win-unpacked/Meridian Desktop.exe", resources: dist/win-unpacked/resources }
          - { os: macos-15, flags: --mac, binary: "dist/mac-arm64/Meridian Desktop.app", resources: "dist/mac-arm64/Meridian Desktop.app/Contents/Resources" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: npm ci
      - name: Build, unsigned
        shell: bash
        run: npm run notices && npx electron-builder ${{ matrix.flags }} --publish never
      - name: The fuses are set in what was built
        shell: bash
        run: |
          npx @electron/fuses read --app "${{ matrix.binary }}" | tee fuses.txt
          for fuse in "RunAsNode is Disabled" "EnableNodeOptionsEnvironmentVariable is Disabled" \
                      "EnableNodeCliInspectArguments is Disabled" "OnlyLoadAppFromAsar is Enabled" \
                      "EnableCookieEncryption is Enabled" "EnableEmbeddedAsarIntegrityValidation is Enabled"; do
            grep -q "$fuse" fuses.txt || { echo "fuse not as required: $fuse" >&2; exit 1; }
          done
      - name: The notices are shipped
        shell: bash
        run: |
          test -s "${{ matrix.resources }}/notices/THIRD_PARTY_NOTICES.txt"
          test -s "${{ matrix.resources }}/LICENSE.meridian-desktop"
          # Electron's licence and Chromium's notices, where the packager puts them: beside the binary on Linux
          # and Windows, and inside the bundle on macOS, where the bundle is all a .dmg or .zip carries.
          ls dist
          case "$RUNNER_OS" in
            macOS) set -- "dist/mac-arm64/Meridian Desktop.app/Contents/Resources" "dist/mac/Meridian Desktop.app/Contents/Resources" ;;
            *) set -- "$(dirname "${{ matrix.resources }}")" ;;
          esac
          for shipped in "$@"; do
            test -s "$shipped/LICENSES.chromium.html" || { echo "Chromium's notices are not shipped in $shipped" >&2; exit 1; }
            test -s "$shipped/LICENSE.electron.txt" || { echo "Electron's licence is not shipped in $shipped" >&2; exit 1; }
          done
