# Temporary: reads the identity provider's released versions, to pin the sign-in job's image.
# Removed before this pull request is ready.
name: chart-probe
on: { pull_request: }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Keycloak's recent releases, with their digests
        run: |
          curl -fsSL "https://quay.io/api/v1/repository/keycloak/keycloak/tag/?limit=40&onlyActiveTags=true" \
            | jq -r '.tags[] | select(.name|test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) | "\(.name) \(.manifest_digest) \(.last_modified)"' | head -20
          curl -fsSL "https://api.github.com/repos/dexidp/dex/releases?per_page=3" | jq -r '.[].tag_name'
